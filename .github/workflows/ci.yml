name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vvln_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d vvln_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/vvln_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/vvln_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fresh migrations and round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m pytest tests/ -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated API demonstration
        run: |
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml build backend
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml up -d db
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml run --rm backend alembic upgrade head
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml run --rm -e PYTHONPATH=/app backend python /scripts/seed_demo.py
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml up -d backend
          docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml exec -T backend python /scripts/check_demo.py
      - name: Cleanup disposable stack
        if: always()
        run: docker compose --env-file /dev/null -p vvln-review -f compose.demo.yml down -v
